name: Spotless
options:
  deploymentTarget:
    macOS: "13.0"
  bundleIdPrefix: com.spotless
  xcodeVersion: "26.0.1"
targets:
  Spotless:
    type: application
    platform: macOS
    sources:
      - path: .
        excludes:
          - "build/**"
          - "Spotless.xcodeproj/**"
    resources:
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spotless.app
        INFOPLIST_KEY_CFBundleDisplayName: Spotless
        INFOPLIST_KEY_LSUIElement: true
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleShortVersionString: "0.1.0"
        INFOPLIST_KEY_CFBundleVersion: "0.1.0"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5.9"
  SpotlessTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ../Tests/SpotlessTests
    dependencies:
      - target: Spotless
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spotless.tests
        GENERATE_INFOPLIST_FILE: true
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5.9"
