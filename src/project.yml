name: CleanMac
options:
  deploymentTarget:
    macOS: "13.0"
  bundleIdPrefix: com.cleanmac
  xcodeVersion: "26.0.1"
targets:
  CleanMac:
    type: application
    platform: macOS
    sources:
      - path: .
        excludes:
          - "build/**"
          - "CleanMac.xcodeproj/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cleanmac.app
        INFOPLIST_KEY_LSUIElement: true
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleShortVersionString: "0.1.0"
        INFOPLIST_KEY_CFBundleVersion: "0.1.0"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5.9"
  CleanMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ../Tests/CleanMacTests
    dependencies:
      - target: CleanMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cleanmac.tests
        GENERATE_INFOPLIST_FILE: true
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5.9"
